[package]
name = "vaulty"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "vaulty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
vaulty-core = { path = "../crates/vaulty-core" }
rusqlite = "0.32"
tokio = { version = "1", features = ["sync"] }
# Market ticker only (opt-in). rustls keeps builds free of OpenSSL on every platform.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Biometric prompt (Touch ID / Face ID, Windows Hello, Android BiometricPrompt, Linux polkit)
# and OS keychain (macOS/iOS Keychain, Windows Credential Manager, Linux Secret Service).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
robius-authentication = "0.3"
keyring = "4"
