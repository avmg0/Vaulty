[package]
name = "vaulty"
version = "0.1.0"
publish = false
edition = "2021"
license = "MIT"

[lib]
name = "vaulty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# No "zip": that is only for the old v1 update format, and it brings an outdated zip crate.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
vaulty-core = { path = "../crates/vaulty-core" }
rusqlite = "0.32"
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Market ticker only (opt-in). rustls keeps builds free of OpenSSL on every platform.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Biometric prompt (Touch ID / Face ID, Windows Hello, Android BiometricPrompt, Linux polkit)
# and OS keychain (macOS/iOS Keychain, Windows Credential Manager, Linux Secret Service).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
robius-authentication = "0.3"
keyring = "4"
# Quick add from anywhere (desktop only).
tauri-plugin-global-shortcut = "2"

# Reading photos of bills with the system's own text recognition (no download, works offline).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSString", "NSEnumerator"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Security_Cryptography", "Foundation", "Foundation_Collections", "Win32_System_WinRT"] }
