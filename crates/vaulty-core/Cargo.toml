[package]
name = "vaulty-core"
version = "0.1.0"
edition = "2021"
description = "Vaulty backend logic: SQLite storage, auth, import/export. No UI/framework dependencies."
license = "MIT"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
csv = "1"
totp-rs = { version = "6", features = ["qr", "otpauth", "gen_secret"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"

[dev-dependencies]
totp-rs = { version = "6", features = ["otpauth", "gen_secret"] }
tempfile = "3"
