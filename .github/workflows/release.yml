# Builds installers when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0) and
# attaches them to a DRAFT GitHub release. Nothing reaches users until the draft is published by
# hand. See docs/RELEASING.md for the one-time setup (update signing key, optional Apple signing).
#
# Third-party actions are pinned to a commit so a moved tag can't change what runs here.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI: "@tauri-apps/cli@2.12.3"

jobs:
  check:
    name: Check the tag and setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Tag matches the app version
        run: |
          app="v$(jq -r .version src-tauri/tauri.conf.json)"
          crate="v$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          ui="v$(jq -r .version ui/package.json)"
          if [ "$app" != "$GITHUB_REF_NAME" ] || [ "$crate" != "$GITHUB_REF_NAME" ] || [ "$ui" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but the versions are $app (tauri.conf.json), $crate (src-tauri/Cargo.toml), $ui (ui/package.json). Update them first."
            exit 1
          fi
      - name: Update signing is set up
        env:
          PUBKEY: ${{ vars.UPDATER_PUBKEY }}
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$PUBKEY" ] || [ -z "$KEY" ]; then
            echo "::error::Add the UPDATER_PUBKEY variable and TAURI_SIGNING_PRIVATE_KEY secret (docs/RELEASING.md)."
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: check
    permissions:
      contents: write       # upload to the draft release
      id-token: write       # build provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
            targets: ""
          # The oldest supported Ubuntu, so the Linux builds run on as many systems as possible.
          - name: Linux
            os: ubuntu-22.04
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.targets }}
      # No build cache here: release builds start clean so nothing cached can leak into them.
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - name: NASM for the bundled OpenSSL (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
      - name: Interface dependencies
        working-directory: ui
        run: npm ci

      # The public half of the update key goes into this build only; local builds can't self-update.
      - name: Release settings
        shell: bash
        env:
          PUBKEY: ${{ vars.UPDATER_PUBKEY }}
        run: |
          jq -n --arg k "$PUBKEY" '{ bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey: $k } } }' > src-tauri/release.conf.json

      # Apple signing and notarisation, only once the secrets exist (docs/RELEASING.md).
      - name: Apple signing
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ]; then
            {
              echo "APPLE_CERTIFICATE=$CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$TEAM"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No Apple signing secrets: the macOS build is unsigned and people will have to allow it in System Settings."
          fi

      - name: Build and upload
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx --yes ${{ env.TAURI_CLI }}
          args: ${{ matrix.args }} --config src-tauri/release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Vaulty ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what's new. Check the download against SHA256SUMS.txt.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true

      - name: List the installers
        id: files
        shell: bash
        env:
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          { echo "list<<EOF"; echo "$PATHS" | jq -r '.[]'; echo "EOF"; } >> "$GITHUB_OUTPUT"
      # Lets anyone confirm an installer was built here, from this commit (gh attestation verify).
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.list }}

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS.txt for every download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dl && cd dl
          gh release download "$TAG" --repo "$REPO" --pattern '*' --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum -- * | tee ../SHA256SUMS.txt
          gh release upload "$TAG" ../SHA256SUMS.txt --repo "$REPO" --clobber
