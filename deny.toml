# cargo-deny policy (run by the "Rust dependencies" check). https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# Known vulnerabilities fail the build. Unmaintained crates are reported for crates we depend
# on directly; the ones that only come in through Tauri's Linux stack are listed below with why.
unmaintained = "workspace"
yanked = "warn"
ignore = []

[licenses]
# Permissive licences only, plus MPL-2.0 (file-level copyleft, fine for an MIT app).
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "BSL-1.0", "MPL-2.0", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are common in the Tauri tree; report them without failing.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Crates only from crates.io; nothing from random git repositories or other registries.
unknown-registry = "deny"
unknown-git = "deny"
